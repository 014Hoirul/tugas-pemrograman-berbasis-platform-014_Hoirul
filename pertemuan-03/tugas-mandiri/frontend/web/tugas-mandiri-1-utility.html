<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Mahasiswa - Utility-First</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-blue-50 px-3 py-6 font-sans text-blue-950 sm:px-4 sm:py-8">

  <main class="mx-auto w-full max-w-4xl">

    <header class="mb-7 text-center">
      <h1 class="mb-2 text-2xl font-bold text-blue-700 sm:text-3xl">
        Profil Mahasiswa
      </h1>

      <p class="text-sm leading-relaxed text-slate-500 sm:text-base">
        Informasi singkat mahasiswa
      </p>
    </header>

    <article class="mx-auto flex w-full max-w-[540px] items-center gap-3 rounded-2xl border border-blue-300 bg-blue-100 p-3 shadow-lg sm:gap-5 sm:p-6">

      <img
        class="h-[72px] w-[72px] shrink-0 rounded-full border-[3px] border-white bg-blue-200 object-cover sm:h-[100px] sm:w-[100px] sm:border-4"
        src="https://i.pravatar.cc/200?img=12"
        alt="Foto profil Hoirul Umam"
      >

      <div class="min-w-0">
        <h2 class="mb-2 break-words text-[17px] font-bold text-blue-800 sm:text-[21px]">
          Hoirul Umam
        </h2>

        <p class="mb-3 break-words text-xs text-slate-600 sm:mb-4 sm:text-sm">
          NIM: 2024520014
        </p>

        <a
          class="inline-block rounded-lg bg-blue-600 px-3 py-[9px] text-xs font-bold text-white no-underline transition hover:-translate-y-0.5 hover:bg-blue-700 sm:px-4 sm:py-[11px] sm:text-sm"
          href="https://github.com/014Hoirul"
          target="_blank"
          rel="noopener noreferrer"
        >
          Lihat Profil
        </a>
      </div>

    </article>

  </main>

</body>
</html>
