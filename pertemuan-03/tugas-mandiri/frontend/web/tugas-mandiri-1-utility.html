<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Mahasiswa - Utility First</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 px-3 py-6 font-sans text-slate-800 sm:px-4 sm:py-8">
  <main class="mx-auto w-full max-w-4xl">
    <header class="mb-6 text-center">
      <h1 class="mb-2 text-2xl font-bold sm:text-[28px]">
        Profil Mahasiswa
      </h1>
      <p class="leading-relaxed text-slate-500">
        Contoh kartu profil dengan pendekatan Utility-First CSS.
      </p>
    </header>

    <article class="mx-auto flex w-full max-w-[540px] items-center gap-3 rounded-2xl border border-slate-200 bg-white p-3 shadow-lg sm:gap-5 sm:p-6">
      <img
        class="h-[72px] w-[72px] shrink-0 rounded-full bg-blue-100 object-cover sm:h-[100px] sm:w-[100px]"
        src="https://i.pravatar.cc/200?img=12"
        alt="Foto profil Hoirul Umam"
      >

      <div class="min-w-0">
        <h2 class="mb-2 break-words text-[17px] font-bold sm:text-[21px]">
          Hoirul Umam
        </h2>

        <p class="mb-4 break-words text-xs text-slate-500 sm:text-sm">
          NIM: 2024520014
        </p>

        <a
          class="inline-block rounded-lg bg-blue-600 px-3 py-2 text-[13px] font-bold text-white no-underline transition hover:bg-blue-700 sm:px-4 sm:py-[10px] sm:text-sm"
          href="https://github.com/014Hoirul"
        >
          Lihat Profil
        </a>
      </div>
    </article>
  </main>
</body>
</html>
