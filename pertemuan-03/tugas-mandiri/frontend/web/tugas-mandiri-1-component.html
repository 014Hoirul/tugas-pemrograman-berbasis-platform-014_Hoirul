<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Mahasiswa - Component-Based</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 16px;
      font-family: Arial, sans-serif;
      background: #eff6ff;
      color: #1e3a8a;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .heading {
      margin-bottom: 28px;
      text-align: center;
    }

    .heading h1 {
      margin: 0 0 10px;
      font-size: 30px;
      color: #1d4ed8;
    }

    .heading p {
      margin: 0;
      color: #64748b;
      font-size: 15px;
      line-height: 1.6;
    }

    .card {
      display: flex;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      padding: 24px;
      background: #dbeafe;
      border: 1px solid #93c5fd;
      border-radius: 18px;
      box-shadow: 0 10px 25px #2563eb1a;
    }

    .profile-photo {
      flex-shrink: 0;
      width: 100px;
      height: 100px;
      object-fit: cover;
      border: 4px solid #ffffff;
      border-radius: 50%;
      background: #bfdbfe;
    }

    .profile-info {
      min-width: 0;
    }

    .profile-info h2 {
      margin: 0 0 8px;
      color: #1e40af;
      font-size: 21px;
      overflow-wrap: anywhere;
    }

    .nim {
      margin: 0 0 18px;
      color: #475569;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .btn {
      display: inline-block;
      padding: 11px 17px;
      border: none;
      border-radius: 9px;
      background: #2563eb;
      color: #ffffff;
      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s;
    }

    .btn:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 24px;
      color: #64748b;
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 400px) {
      body {
        padding: 24px 12px;
      }

      .heading h1 {
        font-size: 24px;
      }

      .heading p {
        font-size: 13px;
      }

      .card {
        gap: 12px;
        padding: 16px 12px;
        border-radius: 14px;
      }

      .profile-photo {
        width: 72px;
        height: 72px;
        border-width: 3px;
      }

      .profile-info h2 {
        font-size: 17px;
      }

      .nim {
        margin-bottom: 14px;
        font-size: 12px;
      }

      .btn {
        padding: 9px 11px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="heading">
      <h1>Profil Mahasiswa</h1>
      <p>Informasi singkat mahasiswa</p>
    </header>

    <article class="card">
      <img
        class="profile-photo"
        src="https://i.pravatar.cc/200?img=12"
        alt="Foto profil Hoirul Umam"
      >

      <div class="profile-info">
        <h2>Hoirul Umam</h2>
        <p class="nim">NIM: 2024520014</p>

        <a
          class="btn"
          href="https://github.com/014Hoirul"
          target="_blank"
          rel="noopener noreferrer"
        >
          Lihat Profil
        </a>
      </div>
    </article>

  </main>
</body>
</html>
